---
layout: default
---
<div >

    <h1 class="post-title" itemprop="name headline">{{ page.title }}</h1>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>
  <hr>
  <h4> Members </h4>
      {% for member in page.members %}
        <h5> <a style="color: black" href="{{ site.data.team_members[member].page }}"> {{ site.data.team_members[member].name }} </a>  </h5>
  {% endfor %}

</div>
